aid: upciti
name: Upciti
description: Upciti is a French smart-city company that equips cities with intelligent
  computer-vision sensors and the Upciti OS platform, turning streets into clear,
  anonymous data for informed municipal decisions across parking, mobility, energy,
  water, gas, lighting, temperature, weather, air quality, pollen, illegal dumping,
  and noise. Sensors process video 100% locally with no image storage (GDPR-native,
  DTPR-supporting), and the platform advertises an open API for connecting GIS, BI,
  and business tools with no proprietary lock-in. Product documentation is customer-gated.
